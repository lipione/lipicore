services:
  db:
    image: postgres:15-alpine
    container_name: lipicore-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lipicore}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: lipicore-qdrant
    restart: always
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:latest
    container_name: lipicore-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  redis:
    image: redis:7-alpine
    container_name: lipicore-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    container_name: lipicore-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-bankai}
      - QDRANT_HOST=qdrant
      - MINIO_ENDPOINT=minio:9000
      - REDIS_URL=redis://redis:6379/0
      - COOKIE_SECURE=true
      - ALLOWED_ORIGINS=https://ai.silverlining.com.np,https://202.51.2.50,http://202.51.2.50,http://localhost:3000,http://localhost
      # LLM routing — overrides .env so git is the source of truth
      - LLM_A_API_BASE=http://lipicore-vllm-b:8000
      - LLM_A_MODEL=gemma-4
      - LLM_A_API_KEY=no-key
      - LLM_B_API_BASE=http://lipicore-vllm-b:8000
      - LLM_B_MODEL=gemma-4
      - LLM_B_API_KEY=no-key
      - LLM_C_API_BASE=http://lipicore-vllm-c:8000
      - LLM_C_MODEL=gemma-4-26b-4bit
      - LLM_C_API_KEY=no-key
    ports:
      - "8000:8000"

  messenger-backend:
    build: ./backend
    container_name: lipicore-messenger-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-bankai}
      - MESSENGER_DATABASE_URL=${MESSENGER_DATABASE_URL:-postgresql://postgres:postgres@db:5432/lipicore}
      - MESSENGER_UPLOAD_DIR=/app/messenger_uploads
      - COOKIE_SECURE=true
      - ALLOWED_ORIGINS=https://ai.silverlining.com.np,https://202.51.2.50,http://202.51.2.50,http://localhost:3000,http://localhost
    command: ["uvicorn", "app.messenger_main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - messenger_upload_data:/app/messenger_uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: lipicore-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: lipicore-nginx
    restart: always
    depends_on:
      - frontend
      - backend
      - messenger-backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./letsencrypt:/etc/letsencrypt:ro
    environment:
      - NGINX_HOST=_
      - NGINX_PORT=80

  vllm-b:
    image: vllm/vllm-openai:latest
    container_name: lipicore-vllm-b
    restart: always
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
    entrypoint: /bin/bash
    command:
      - -c
      - "vllm serve /data/models/llm/gemma-4-E4B-it --host 0.0.0.0 --port 8000 --gpu-memory-utilization 0.45 --max-model-len 4096 --max-num-seqs 16 --served-model-name gemma-4 --enable-prefix-caching --kv-cache-dtype fp8"
    volumes:
      - /data:/data
    ports:
      - "8002:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  vllm-c:
    image: vllm/vllm-openai:latest
    container_name: lipicore-vllm-c
    restart: always
    environment:
      NVIDIA_VISIBLE_DEVICES: "1"
    entrypoint: /bin/bash
    command:
      - -c
      - "vllm serve /data/models/llm/gemma-4-26b-a4b-awq-4bit --host 0.0.0.0 --port 8000 --gpu-memory-utilization 0.80 --max-model-len 4096 --max-num-batched-tokens 4096 --max-num-seqs 8 --served-model-name gemma-4-26b-4bit --enable-prefix-caching --kv-cache-dtype fp8"
    volumes:
      - /data:/data
    ports:
      - "8003:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
  redis_data:
  messenger_upload_data:
